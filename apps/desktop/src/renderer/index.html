<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss: http://127.0.0.1:* http://localhost:*; media-src 'self' http://127.0.0.1:* http://localhost:*"
    />
    <title>virtual-original-bot</title>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand__dot"></span>
          <h1>virtual-original-bot</h1>
        </div>
        <span id="status" class="status status--connecting">连接中…</span>
        <span id="character-status" class="status status--character-idle">空闲</span>
        <div class="session-bar">
          <label class="session-bar__label" for="session-select">会话</label>
          <select id="session-select" aria-label="会话选择">
            <option value="">加载中…</option>
          </select>
          <button id="session-new" class="session-bar__new" type="button">新会话</button>
        </div>
        <button id="memory-open" class="memory-open" type="button">记忆</button>
        <div class="voice-bar">
          <label class="voice-bar__label" for="voice-select">音色</label>
          <select id="voice-select" aria-label="音色选择">
            <option value="">加载中…</option>
          </select>
          <button id="voice-audition" class="voice-bar__action" type="button" disabled>试听</button>
          <button id="voice-rename" class="voice-bar__action" type="button" disabled>重命名</button>
          <button id="voice-delete" class="voice-bar__action" type="button" disabled>删除</button>
          <button id="voice-clone-open" class="voice-bar__clone" type="button">克隆音色</button>
          <span id="voice-hint" class="voice-hint" role="status" aria-live="polite" hidden></span>
        </div>
        <span class="live2d-label">Live2D Mao PRO（本地验证）</span>
      </header>

      <main class="workspace">
        <section class="character-panel" aria-label="Live2D 角色">
          <canvas id="live2d-canvas"></canvas>
          <span id="live2d-status">Live2D 加载中…</span>
          <div class="character-panel__controls">
            <button id="live2d-motion" type="button">播放示例动作</button>
            <select id="live2d-expression" aria-label="Live2D 表情">
              <option value="">选择示例表情</option>
              <option value="exp_01">表情 01</option>
              <option value="exp_02">表情 02</option>
              <option value="exp_03">表情 03</option>
              <option value="exp_04">表情 04</option>
              <option value="exp_05">表情 05</option>
              <option value="exp_06">表情 06</option>
              <option value="exp_07">表情 07</option>
              <option value="exp_08">表情 08</option>
            </select>
          </div>
        </section>
        <main id="messages" class="messages" aria-live="polite"></main>
      </main>

      <form id="composer" class="composer">
        <input
          id="input"
          class="composer__input"
          type="text"
          autocomplete="off"
          placeholder="输入文本，回车发送"
        />
        <button id="send" class="composer__send" type="submit">发送</button>
        <button id="record" class="composer__record" type="button">开始录音</button>
        <button id="stop-audio" class="composer__stop" type="button" disabled>停止语音</button>
      </form>

      <section id="clone-panel" class="clone-panel" aria-label="音色克隆" hidden>
        <form id="clone-form" class="clone-panel__card">          <h2 class="clone-panel__title">克隆音色</h2>

          <label class="clone-panel__field">
            <span>名称</span>
            <input id="clone-name" type="text" maxlength="64" autocomplete="off" placeholder="例如：我的声音" />
          </label>

          <label class="clone-panel__field">
            <span>语言</span>
            <select id="clone-language">
              <option value="ZH">中文（ZH）</option>
              <option value="JA">日本語（JA）</option>
              <option value="EN">English（EN）</option>
            </select>
          </label>

          <label class="clone-panel__field">
            <span>参考音频</span>
            <input id="clone-audio" type="file" accept="audio/*" />
          </label>

          <p class="clone-panel__tip">建议 1–60 秒的清晰人声，wav / mp3 / m4a 等格式。</p>
          <p id="clone-error" class="clone-panel__error" role="alert" hidden></p>

          <div class="clone-panel__actions">
            <button id="clone-submit" class="clone-panel__submit" type="submit">提交克隆</button>
            <button id="clone-cancel" class="clone-panel__cancel" type="button">取消</button>
          </div>
        </form>
      </section>

      <section id="memory-panel" class="clone-panel" aria-label="长期记忆" hidden>
        <div class="clone-panel__card">
          <h2 class="clone-panel__title">长期记忆</h2>
          <p id="memory-summary" class="memory-summary"></p>
          <ul id="memory-notes" class="memory-notes"></ul>
          <form id="memory-form" class="memory-form">
            <input id="memory-input" type="text" maxlength="200" placeholder="例如：记住 我喜欢红茶" />
            <button id="memory-add" class="clone-panel__submit" type="submit">添加</button>
          </form>
          <p id="memory-error" class="clone-panel__error" role="alert" hidden></p>
          <div class="clone-panel__actions">
            <button id="memory-close" class="clone-panel__cancel" type="button">关闭</button>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
